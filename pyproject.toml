[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morpher"
version = "0.1.0"
description = "Modular design compiler for HTML/CSS and Elementor outputs."
requires-python = ">=3.11"

[project.scripts]
morpher-listen = "morpher.listener:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
