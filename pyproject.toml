[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morpher"
version = "0.1.0"
description = "Modular design compiler for HTML/CSS and Elementor outputs."
requires-python = ">=3.11"
dependencies = [
    "fonttools[woff]>=4.58",
    "Pillow>=10",
    "resvg_py>=0.5,<0.6",
]

[project.scripts]
morpher = "morpher.run:main"
morpher-deploy = "morpher.deploy:main"
morpher-listen = "morpher.listener:main"
morpher-inspect = "morpher.inspect:main"
morpher-render = "morpher.render:main"
morpher-fonts = "morpher.fonts.inspect:main"
morpher-rm = "morpher.remove:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
