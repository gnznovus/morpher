[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morpher"
version = "0.1.0"
description = "Modular design compiler for HTML/CSS and Elementor outputs."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "fonttools[woff]>=4.58",
    "Jinja2>=3.1,<4",
    "Pillow>=10",
    "resvg_py>=0.5,<0.6",
    "uvicorn>=0.30,<1",
]

[project.scripts]
morpher = "morpher.run:main"
morpher-deploy = "morpher.deploy:main"
morpher-listen = "morpher.listener:main"
morpher-inspect = "morpher.inspect:main"
morpher-render = "morpher.render:main"
morpher-fonts = "morpher.fonts.inspect:main"
morpher-rm = "morpher.remove:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"morpher.dashboard" = ["templates/*.html", "templates/partials/*.html", "static/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
